<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .leaf-a{ fill:#7C9885; }
      .leaf-b{ fill:#2F4A3B; }
      .leaf-c{ fill:#A9C0AE; }
      .petal{ fill:#FBFBF6; stroke:#8AA98F; stroke-width:1.2; }
      .center{ fill:#B9975B; }
      .berry{ fill:#B9975B; opacity:0.55; }
      .stem{ stroke:#7C9885; stroke-width:2; fill:none; stroke-linecap:round; }
      .sway{ transform-origin: 8px 8px; }
      .sway-1{ animation: sway1 5s ease-in-out infinite; }
      .sway-2{ animation: sway2 6s ease-in-out infinite; animation-delay: 0.4s; }
      .sway-3{ animation: sway3 5.5s ease-in-out infinite; animation-delay: 0.8s; }
      @keyframes sway1{
        0%,100%{ transform: rotate(-2.5deg); }
        50%{ transform: rotate(2.5deg); }
      }
      @keyframes sway2{
        0%,100%{ transform: rotate(2deg) translateY(0); }
        50%{ transform: rotate(-2deg) translateY(-1.5px); }
      }
      @keyframes sway3{
        0%,100%{ transform: rotate(-1.6deg) translateY(0); }
        50%{ transform: rotate(1.8deg) translateY(1.5px); }
      }
    </style>
  </defs>

  <!-- stems -->
  <path class="stem" d="M8,8 C40,34 58,58 74,92" />
  <path class="stem" d="M8,8 C28,20 46,30 66,52" />
  <path class="stem" d="M8,8 C22,42 30,72 46,104" />

  <!-- eucalyptus leaves, group animated for sway -->
  <g class="sway sway-1">
    <ellipse class="leaf-a" cx="30" cy="20" rx="13" ry="9" transform="rotate(35 30 20)"/>
    <ellipse class="leaf-b" cx="46" cy="34" rx="11" ry="8" transform="rotate(50 46 34)"/>
    <ellipse class="leaf-c" cx="20" cy="42" rx="10" ry="7" transform="rotate(-10 20 42)"/>
  </g>

  <g class="sway sway-2">
    <ellipse class="leaf-a" cx="58" cy="54" rx="12" ry="8" transform="rotate(60 58 54)"/>
    <ellipse class="leaf-b" cx="40" cy="66" rx="10" ry="7" transform="rotate(15 40 66)"/>
    <ellipse class="leaf-c" cx="66" cy="72" rx="9" ry="6" transform="rotate(80 66 72)"/>
  </g>

  <g class="sway sway-3">
    <ellipse class="leaf-b" cx="30" cy="78" rx="10" ry="7" transform="rotate(-20 30 78)"/>
    <ellipse class="leaf-a" cx="48" cy="92" rx="11" ry="7" transform="rotate(40 48 92)"/>
    <ellipse class="leaf-c" cx="20" cy="96" rx="8" ry="6" transform="rotate(-5 20 96)"/>
  </g>

  <!-- white blossoms -->
  <g class="sway sway-1" transform="translate(4,4)">
    <g>
      <circle class="petal" cx="14" cy="0"  r="7"/>
      <circle class="petal" cx="0"  cy="14" r="7"/>
      <circle class="petal" cx="-14" cy="0" r="7"/>
      <circle class="petal" cx="0" cy="-14" r="7"/>
      <circle class="petal" cx="10" cy="10" r="7"/>
      <circle class="center" cx="0" cy="0" r="4"/>
    </g>
  </g>

  <g class="sway sway-2" transform="translate(58,30)">
    <g>
      <circle class="petal" cx="10" cy="0"  r="6"/>
      <circle class="petal" cx="0"  cy="10" r="6"/>
      <circle class="petal" cx="-10" cy="0" r="6"/>
      <circle class="petal" cx="0" cy="-10" r="6"/>
      <circle class="petal" cx="7" cy="7" r="6"/>
      <circle class="center" cx="0" cy="0" r="3.2"/>
    </g>
  </g>

  <g class="sway sway-3" transform="translate(64,86)">
    <g>
      <circle class="petal" cx="8" cy="0"  r="5"/>
      <circle class="petal" cx="0"  cy="8" r="5"/>
      <circle class="petal" cx="-8" cy="0" r="5"/>
      <circle class="petal" cx="0" cy="-8" r="5"/>
      <circle class="petal" cx="6" cy="6" r="5"/>
      <circle class="center" cx="0" cy="0" r="2.6"/>
    </g>
  </g>

  <!-- tiny berry accents -->
  <circle class="berry" cx="52" cy="18" r="2.6"/>
  <circle class="berry" cx="62" cy="26" r="2.2"/>
  <circle class="berry" cx="36" cy="100" r="2.4"/>
  <circle class="berry" cx="18" cy="60" r="2"/>
</svg>
