<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" fill="none">
  <defs>
    <style>
      .leafA{ fill:#7C9885; }
      .leafB{ fill:#2F4A3B; }
      .leafC{ fill:#B7CBBB; }
      .leafD{ fill:#5E7C68; }
      .petal{ fill:#FBFBF6; stroke:#8AA98F; stroke-width:1; }
      .petalWarm{ fill:#F7F4EC; stroke:#C9B37A; stroke-width:1; }
      .center{ fill:#B9975B; }
      .berry{ fill:#B9975B; opacity:0.6; }
      .stem{ stroke:#7C9885; stroke-width:1.6; fill:none; stroke-linecap:round; }
      .stemThin{ stroke:#A9C0AE; stroke-width:0.9; fill:none; stroke-linecap:round; }
      .sway{ transform-origin: 8px 8px; }
      .sway-1{ animation: sway1 5s ease-in-out infinite; }
      .sway-2{ animation: sway2 6s ease-in-out infinite; animation-delay:0.3s; }
      .sway-3{ animation: sway3 5.5s ease-in-out infinite; animation-delay:0.6s; }
      .sway-4{ animation: sway1 6.5s ease-in-out infinite; animation-delay:0.9s; }
      @keyframes sway1{ 0%,100%{ transform: rotate(-2.2deg); } 50%{ transform: rotate(2.2deg); } }
      @keyframes sway2{ 0%,100%{ transform: rotate(1.8deg) translateY(0); } 50%{ transform: rotate(-1.8deg) translateY(-1.2px); } }
      @keyframes sway3{ 0%,100%{ transform: rotate(-1.4deg) translateY(0); } 50%{ transform: rotate(1.6deg) translateY(1.2px); } }
    </style>
  </defs>

  <path class="stem" d="M10,10 C60,42 92,72 122,118"/>
  <path class="stem" d="M10,10 C42,26 68,37 94,62"/>
  <path class="stem" d="M10,10 C28,54 44,92 66,132"/>
  <path class="stemThin" d="M10,10 C70,18 116,29 152,44"/>
  <path class="stemThin" d="M10,10 C18,68 28,112 46,152"/>

  <g class="sway sway-3">
    <ellipse class="leafC" cx="118" cy="32" rx="20" ry="13" transform="rotate(40 118 32)"/>
    <ellipse class="leafC" cx="44" cy="118" rx="17" ry="12" transform="rotate(-25 44 118)"/>
    <ellipse class="leafC" cx="138" cy="70" rx="14" ry="9" transform="rotate(70 138 70)"/>
  </g>

  <g class="sway sway-1">
    <ellipse class="leafA" cx="44" cy="28" rx="20" ry="13" transform="rotate(35 44 28)"/>
    <ellipse class="leafA" cx="75" cy="51" rx="19" ry="12" transform="rotate(55 75 51)"/>
    <ellipse class="leafA" cx="36" cy="75" rx="17" ry="12" transform="rotate(-15 36 75)"/>
    <ellipse class="leafD" cx="59" cy="39" rx="16" ry="10" transform="rotate(-30 59 39)"/>
  </g>

  <g class="sway sway-2">
    <ellipse class="leafA" cx="94" cy="90" rx="16" ry="10" transform="rotate(65 94 90)"/>
    <ellipse class="leafA" cx="55" cy="129" rx="15" ry="10" transform="rotate(10 55 129)"/>
    <ellipse class="leafA" cx="110" cy="35" rx="14" ry="9" transform="rotate(20 110 35)"/>
    <ellipse class="leafD" cx="90" cy="66" rx="14" ry="9" transform="rotate(45 90 66)"/>
    <ellipse class="leafD" cx="27" cy="98" rx="13" ry="9" transform="rotate(5 27 98)"/>
  </g>

  <g class="sway sway-4">
    <ellipse class="leafB" cx="23" cy="51" rx="13" ry="9" transform="rotate(-40 23 51)"/>
    <ellipse class="leafB" cx="71" cy="24" rx="13" ry="9" transform="rotate(15 71 24)"/>
    <ellipse class="leafB" cx="47" cy="106" rx="12" ry="8" transform="rotate(-20 47 106)"/>
    <ellipse class="leafB" cx="102" cy="55" rx="11" ry="7" transform="rotate(60 102 55)"/>
    <ellipse class="leafD" cx="118" cy="94" rx="11" ry="7" transform="rotate(80 118 94)"/>
  </g>

  <g class="sway sway-1" transform="translate(47,39)">
    <circle class="petal" cx="12" cy="0" r="7.5"/>
    <circle class="petal" cx="0" cy="12" r="7.5"/>
    <circle class="petal" cx="-12" cy="0" r="7.5"/>
    <circle class="petal" cx="0" cy="-12" r="7.5"/>
    <circle class="petal" cx="8.5" cy="8.5" r="7.5"/>
    <circle class="petal" cx="-8.5" cy="-8.5" r="7.5"/>
    <circle class="center" cx="0" cy="0" r="4.2"/>
  </g>

  <g class="sway sway-2" transform="translate(95,35)">
    <circle class="petalWarm" cx="10" cy="0" r="6.5"/>
    <circle class="petalWarm" cx="0" cy="10" r="6.5"/>
    <circle class="petalWarm" cx="-10" cy="0" r="6.5"/>
    <circle class="petalWarm" cx="0" cy="-10" r="6.5"/>
    <circle class="petalWarm" cx="7" cy="7" r="6.5"/>
    <circle class="center" cx="0" cy="0" r="3.4"/>
  </g>

  <g class="sway sway-3" transform="translate(29,78)">
    <circle class="petal" cx="9" cy="0" r="6"/>
    <circle class="petal" cx="0" cy="9" r="6"/>
    <circle class="petal" cx="-9" cy="0" r="6"/>
    <circle class="petal" cx="0" cy="-9" r="6"/>
    <circle class="petal" cx="6.5" cy="6.5" r="6"/>
    <circle class="center" cx="0" cy="0" r="3"/>
  </g>

  <g class="sway sway-4" transform="translate(75,86)">
    <circle class="petalWarm" cx="6.8" cy="0" r="5"/>
    <circle class="petalWarm" cx="0" cy="6.8" r="5"/>
    <circle class="petalWarm" cx="-6.8" cy="0" r="5"/>
    <circle class="petalWarm" cx="0" cy="-6.8" r="5"/>
    <circle class="center" cx="0" cy="0" r="2.4"/>
  </g>

  <g class="sway sway-2" transform="translate(61,124)">
    <circle class="petal" cx="5.4" cy="0" r="4.2"/>
    <circle class="petal" cx="0" cy="5.4" r="4.2"/>
    <circle class="petal" cx="-5.4" cy="0" r="4.2"/>
    <circle class="petal" cx="0" cy="-5.4" r="4.2"/>
    <circle class="center" cx="0" cy="0" r="2.1"/>
  </g>

  <circle class="berry" cx="78" cy="19" r="2.6"/>
  <circle class="berry" cx="140" cy="46" r="2.3"/>
  <circle class="berry" cx="148" cy="33" r="1.9"/>
  <circle class="berry" cx="24" cy="140" r="2.3"/>
  <circle class="berry" cx="42" cy="150" r="1.9"/>
  <circle class="berry" cx="118" cy="24" r="1.7"/>
  <circle class="berry" cx="8" cy="90" r="2"/>
  <circle class="berry" cx="128" cy="78" r="1.7"/>
</svg>
